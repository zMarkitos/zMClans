# ===================================================================
#  zMClans - Clan Homes
#  File: guis/homes.yml
# Left-click = Teleport
# Right-click / Q = Delete
# ===================================================================

clan_homes:
  title: "&8Clan Homes ({homes_count})"
  rows: 6
  page-size: 28
  page-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34,37,38,39,40,41,42,43]
  open-sound: "BLOCK_NOTE_BLOCK_PLING"

  items:
    FILLER:
      material: GRAY_STAINED_GLASS_PANE
      display-name: " "
      slots:
        - 0-3
        - 5-8
        - 9,17,18,26,27,35,36,44
        - 45-53

    ALLY_HOMES:
      material: ENDER_CHEST
      slot: 4
      display-name: "&fClan &8→ &#D8A7FFAlly Homes"
      lore:
        - ""
        - " &8| &fBrowse the homes shared"
        - " &8| &fby your allied clans."
        - ""
        - " &8• &fAvailable when an ally"
        - "   &fallows sharing their homes."
        - ""
        - "&#D8A7FF✔ &nClick to view!"
      action: OPEN_ALLY_HOMES

    HOME_ENTRY:
      material: RED_BED
      display-name: "&fHome &8→ &#55FFAA{home}"
      lore:
        - ""
        - " &8• &fWorld: &#C7FF78{world}"
        - " &8• &fLocation: &#43FF67{x}, {y}, {z}"
        - ""
        - "&#90FF21✔ &nLeft-click to teleport!"
        - "&#FF2121✖ &nRight-click / Q to delete!"
      action: NONE

    BACK:
      material: ARROW
      slot: 45
      display-name: "&fNavigation &8→ &#E65100Back"
      lore:
        - ""
        - " &8| &fReturn to the"
        - " &8| &fprevious menu."
        - ""
        - "&#E65100✔ &nClick to go back!"
      action: BACK_PREVIOUS

    PREVIOUS:
      material: ARROW
      slot: 48
      display-name: "&fNavigation &8→ &#31A3FFPrevious"
      lore:
        - ""
        - " &8| &fGo to the"
        - " &8| &fprevious page."
        - ""
        - "&#31A3FF✔ &nClick to go back!"
      action: PAGE_PREV

    PAGE_INFO:
      material: PAPER
      slot: 49
      display-name: "&fPage &8→ &#FFEA00{page}&8/&#FFEA00{max_pages}"
      lore:
        - ""
        - " &8• &fTotal homes: &#C7FF78{total_items} 🏠"
        - ""
      action: NONE

    NEXT:
      material: ARROW
      slot: 50
      display-name: "&fNavigation &8→ &#31A3FFNext"
      lore:
        - ""
        - " &8| &fGo to the"
        - " &8| &fnext page."
        - ""
        - "&#31A3FF✔ &nClick to advance!"
      action: PAGE_NEXT

    CLOSE:
      material: BARRIER
      slot: 53
      display-name: "&fNavigation &8→ &#E65100Close"
      lore:
        - ""
        - " &8| &fClose this menu"
        - " &8| &fand continue exploring."
        - ""
        - "&#E65100✔ &nClick to close!"
      action: CLOSE
