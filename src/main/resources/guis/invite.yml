      display-name: " "
      slots:
        - 0-8
        - 9,17,18,26,27,35
        - 36-44

    PLAYER_ENTRY:
      material: playerhead
      display-name: "&fPlayer &8→ &#00C853{player}"
      lore:
        - ""
        - " &8• &fStatus: &#90FF21Online ●"
        - " &8• &fPing: &#C7FF78{ping}ms ⚡"
