    PREV_PAGE:
      material: ARROW
      slot: 36
      display-name: "&fNavigation &8→ &#31A3FFPrevious"
      lore:
        - ""
        - " &8| &fGo to the"
        - " &8| &fprevious page."
        - ""
        - "&#31A3FF✔ &nClick to go back!"
      action: PAGE_PREV

    BACK:
      material: ARROW
      slot: 39
      display-name: "&fNavigation &8→ &#E65100Back"
      lore:
        - ""
        - " &8| &fReturn to the"
        - " &8| &fprevious menu."
        - ""
        - "&#E65100✔ &nClick to go back!"
      action: BACK_PREVIOUS

    PAGE_INFO:
      material: PAPER
      slot: 40
      display-name: "&fPage &8→ &#FFEA00{page}&8/&#FFEA00{max_pages}"
      lore:
        - ""
        - " &8• &fAvailable players: &#C7FF78{total_items} 👥"
        - ""
      action: NONE

    NEXT_PAGE:
      material: ARROW
      slot: 41
      display-name: "&fNavigation &8→ &#31A3FFNext"
      lore:
        - ""
        - " &8| &fGo to the"
        - " &8| &fnext page."
        - ""
        - "&#31A3FF✔ &nClick to advance!"
      action: PAGE_NEXT
