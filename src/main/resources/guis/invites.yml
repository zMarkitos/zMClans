# ===================================================================
#  zMClans - Pending Invitations
#  File: guis/invites.yml
# ===================================================================
# Left-click = Accept
# Right-click = Deny
# ===================================================================

clan_invites:
  title: "&8Pending Invitations"
  rows: 5
  page-size: 21
  page-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  open-sound: "BLOCK_NOTE_BLOCK_PLING"

  items:
    FILLER:
      material: GRAY_STAINED_GLASS_PANE
      display-name: " "
      slots:
        - 0-8
        - 9,17,18,26,27,35
        - 36-44

    INVITATION_ENTRY:
      material: SHIELD
      display-name: "&fClan &8→ &#FFEA00{clan} &8[&f{tag}&8]"
      lore:
        - ""
        - " &8• &fInvited by: &#C7FF78{sender} 👤"
        - " &8• &fMembers: &#00E5FF{members}&8/&#00E5FF{max} 👥"
        - ""
        - "&#90FF21✔ &nLeft-click to accept!"
        - "&#FF2121✖ &nRight-click to deny!"
      action: NONE

    PREV_PAGE:
      material: ARROW
      slot: 36
      display-name: "&fNavigation &8→ &#31A3FFPrevious"
      lore:
        - ""
        - " &8| &fGo to the"
        - " &8| &fprevious page."
        - ""
        - "&#31A3FF✔ &nClick to go back!"
      action: PAGE_PREV

    BACK:
      material: ARROW
      slot: 39
      display-name: "&fNavigation &8→ &#E65100Back"
      lore:
        - ""
        - " &8| &fReturn to the"
        - " &8| &fmain menu."
        - ""
        - "&#E65100✔ &nClick to go back!"
      action: BACK_PREVIOUS

    PAGE_INFO:
      material: PAPER
      slot: 40
      display-name: "&fPage &8→ &#FFEA00{page}&8/&#FFEA00{max_pages}"
      lore:
        - ""
        - " &8• &fTotal invitations: &#C7FF78{total_items} ✉"
        - ""
      action: NONE

    NEXT_PAGE:
      material: ARROW
      slot: 41
      display-name: "&fNavigation &8→ &#31A3FFNext"
      lore:
        - ""
        - " &8| &fGo to the"
        - " &8| &fnext page."
        - ""
        - "&#31A3FF✔ &nClick to advance!"
      action: PAGE_NEXT
